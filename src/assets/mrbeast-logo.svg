<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="beastPantherBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00BCEB" />
      <stop offset="100%" stopColor="#087BFA" />
    </linearGradient>
    <linearGradient id="pantherLightningPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF3D91" />
      <stop offset="100%" stopColor="#E60067" />
    </linearGradient>
    <filter id="lightningGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- MrBeast Roaring Blue Panther Head -->
  <path
    d="M20 36 C18 24, 30 16, 40 22 C46 17, 56 17, 62 22 C72 16, 82 24, 80 36 C84 46, 80 58, 74 66 C68 74, 58 84, 50 88 C40 84, 32 74, 26 66 C20 58, 16 46, 20 36 Z"
    fill="url(#beastPantherBlue)"
  />

  <!-- Panther Inner Ears -->
  <polygon points="28,24 36,33 26,38" fill="#101826" />
  <polygon points="72,24 64,33 74,38" fill="#101826" />

  <!-- Panther Intense Eyes -->
  <polygon points="34,44 42,40 40,48 33,47" fill="#FFFFFF" />
  <polygon points="66,44 58,40 60,48 67,47" fill="#FFFFFF" />
  <circle cx="37" cy="44" r="2" fill="#070A10" />
  <circle cx="63" cy="44" r="2" fill="#070A10" />

  <!-- Snout and Whiskers -->
  <path d="M42 56 Q50 52 58 56 L50 64 Z" fill="#101826" />
  <line x1="26" y1="56" x2="12" y2="52" stroke="#00BCEB" stroke-width="1.8" stroke-linecap="round" />
  <line x1="26" y1="60" x2="14" y2="64" stroke="#00BCEB" stroke-width="1.8" stroke-linecap="round" />
  <line x1="74" y1="56" x2="88" y2="52" stroke="#00BCEB" stroke-width="1.8" stroke-linecap="round" />
  <line x1="74" y1="60" x2="86" y2="64" stroke="#00BCEB" stroke-width="1.8" stroke-linecap="round" />

  <!-- Fierce Fangs -->
  <polygon points="38,64 42,75 46,64" fill="#FFFFFF" />
  <polygon points="62,64 58,75 54,64" fill="#FFFFFF" />

  <!-- Signature MrBeast Pink Lightning Bolt Across Left Eye -->
  <polygon
    points="38,12 28,38 40,36 31,66 52,40 40,42"
    fill="url(#pantherLightningPink)"
    filter="url(#lightningGlow)"
  />
  <polygon
    points="38,12 28,38 40,36 31,66 52,40 40,42"
    fill="#FF3D91"
  />
</svg>
